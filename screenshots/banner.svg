<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Mew-Chat sunset banner</title>
  <desc>Animated sunset-themed banner for Mew-Chat with a floating cat and chat bubbles</desc>
  <defs>
    <style>
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
      @keyframes b1{0%,100%{opacity:0;transform:scale(.75) translateY(5px)}20%,78%{opacity:1;transform:scale(1) translateY(0)}}
      @keyframes b2{0%,32%,100%{opacity:0;transform:scale(.75) translateY(5px)}52%,84%{opacity:1;transform:scale(1) translateY(0)}}
      @keyframes b3{0%,52%,100%{opacity:0;transform:scale(.75) translateY(5px)}70%,90%{opacity:1;transform:scale(1) translateY(0)}}
      @keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
      @keyframes glow{0%,100%{opacity:.18}50%{opacity:.38}}
      @keyframes tailwag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
      .cat{animation:float 3.4s ease-in-out infinite;transform-origin:200px 130px}
      .el{animation:blink 4.5s ease-in-out infinite;transform-origin:183px 118px}
      .er{animation:blink 4.5s ease-in-out infinite .2s;transform-origin:217px 118px}
      .b1{animation:b1 4.2s ease-in-out infinite;transform-origin:290px 80px}
      .b2{animation:b2 4.2s ease-in-out infinite .7s;transform-origin:350px 112px}
      .b3{animation:b3 4.2s ease-in-out infinite 1.3s;transform-origin:310px 142px}
      .d1{animation:dot 1.3s ease-in-out infinite 0s}
      .d2{animation:dot 1.3s ease-in-out infinite .28s}
      .d3{animation:dot 1.3s ease-in-out infinite .56s}
      .glow{animation:glow 3s ease-in-out infinite}
      .tail{animation:tailwag 2s ease-in-out infinite;transform-origin:200px 170px}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="50%" stop-color="#200d0a"/>
      <stop offset="100%" stop-color="#150608"/>
    </linearGradient>
    <radialGradient id="horizon" cx="72%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#c0440a" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#1a0808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c45c3a"/>
      <stop offset="100%" stop-color="#a0412a"/>
    </linearGradient>
    <linearGradient id="tailgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c45c3a"/>
      <stop offset="100%" stop-color="#ff9a44"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff865b"/>
      <stop offset="50%" stop-color="#ffba62"/>
      <stop offset="100%" stop-color="#ff9a44"/>
    </linearGradient>
  </defs>

  <rect width="680" height="200" rx="16" fill="url(#bg)"/>
  <rect width="680" height="200" rx="16" fill="url(#horizon)"/>

  <circle cx="55"  cy="22" r="1"   fill="#ffba62" opacity=".35"/>
  <circle cx="120" cy="14" r=".7"  fill="#ffffff" opacity=".2"/>
  <circle cx="90"  cy="42" r=".8"  fill="#ffba62" opacity=".28"/>
  <circle cx="160" cy="10" r="1.1" fill="#ffffff" opacity=".18"/>
  <circle cx="35"  cy="68" r=".6"  fill="#ff865b" opacity=".25"/>
  <circle cx="610" cy="25" r="1"   fill="#ffba62" opacity=".3"/>
  <circle cx="650" cy="14" r=".7"  fill="#ffffff" opacity=".2"/>
  <circle cx="630" cy="55" r=".9"  fill="#ff865b" opacity=".22"/>
  <circle cx="570" cy="170" r=".8" fill="#ffba62" opacity=".2"/>
  <circle cx="70"  cy="175" r=".9" fill="#ffffff" opacity=".18"/>

  <ellipse class="glow" cx="200" cy="188" rx="55" ry="10" fill="#ff6b2b" opacity=".22"/>

  <g class="cat">
    <g class="tail">
      <path d="M210 172 Q240 178 248 162 Q256 146 242 138 Q232 132 228 140" fill="none" stroke="#7a2e12" stroke-width="11" stroke-linecap="round"/>
      <path d="M210 172 Q240 178 248 162 Q256 146 242 138 Q232 132 228 140" fill="none" stroke="url(#tailgrad)" stroke-width="8" stroke-linecap="round"/>
      <path d="M212 170 Q240 175 247 161 Q254 147 241 140" fill="none" stroke="#f4a07a" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
      <circle cx="228" cy="140" r="9" fill="#ff9a44"/>
      <circle cx="228" cy="140" r="6" fill="#ffba62"/>
      <circle cx="226" cy="138" r="3" fill="#fff3d4" opacity=".6"/>
    </g>

    <polygon points="157,88 172,58 188,88" fill="url(#fur)"/>
    <polygon points="212,88 228,58 242,88" fill="url(#fur)"/>
    <polygon points="163,87 172,65 183,87" fill="#f4a07a" opacity=".55"/>
    <polygon points="217,87 228,65 237,87" fill="#f4a07a" opacity=".55"/>

    <circle cx="200" cy="115" r="40" fill="url(#fur)"/>
    <ellipse cx="200" cy="128" rx="15" ry="11" fill="#f0c4a8" opacity=".65"/>

    <ellipse class="el" cx="183" cy="118" rx="7" ry="8" fill="#1a0808"/>
    <ellipse class="er" cx="217" cy="118" rx="7" ry="8" fill="#1a0808"/>
    <circle cx="186" cy="115" r="2.5" fill="#fff" opacity=".9"/>
    <circle cx="220" cy="115" r="2.5" fill="#fff" opacity=".9"/>
    <ellipse cx="183" cy="119" rx="3.5" ry="6" fill="#3d1008"/>
    <ellipse cx="217" cy="119" rx="3.5" ry="6" fill="#3d1008"/>
    <ellipse cx="183" cy="118" rx="7" ry="8" fill="none" stroke="#ffba62" stroke-width=".8" opacity=".5"/>
    <ellipse cx="217" cy="118" rx="7" ry="8" fill="none" stroke="#ffba62" stroke-width=".8" opacity=".5"/>

    <ellipse cx="200" cy="127" rx="3.5" ry="2.5" fill="#ff865b" opacity=".9"/>
    <path d="M196 130 Q198 133 200 131 Q202 133 204 130" fill="none" stroke="#a04030" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="164" y1="124" x2="185" y2="127" stroke="#f0c4a8" stroke-width="1" opacity=".65"/>
    <line x1="161" y1="130" x2="184" y2="130" stroke="#f0c4a8" stroke-width="1" opacity=".55"/>
    <line x1="215" y1="127" x2="236" y2="124" stroke="#f0c4a8" stroke-width="1" opacity=".65"/>
    <line x1="216" y1="130" x2="239" y2="130" stroke="#f0c4a8" stroke-width="1" opacity=".55"/>

    <ellipse cx="200" cy="163" rx="32" ry="22" fill="url(#fur)"/>

    <ellipse cx="186" cy="182" rx="13" ry="7.5" fill="#a0412a"/>
    <ellipse cx="214" cy="182" rx="13" ry="7.5" fill="#a0412a"/>
    <ellipse cx="186" cy="181" rx="9"  ry="5"   fill="#c45c3a"/>
    <ellipse cx="214" cy="181" rx="9"  ry="5"   fill="#c45c3a"/>
    <line x1="183" y1="177" x2="183" y2="184" stroke="#8a3020" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
    <line x1="186" y1="176" x2="186" y2="185" stroke="#8a3020" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
    <line x1="189" y1="177" x2="189" y2="184" stroke="#8a3020" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
    <line x1="211" y1="177" x2="211" y2="184" stroke="#8a3020" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
    <line x1="214" y1="176" x2="214" y2="185" stroke="#8a3020" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
    <line x1="217" y1="177" x2="217" y2="184" stroke="#8a3020" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
  </g>

  <g class="b1">
    <rect x="265" y="53" width="96" height="36" rx="12" fill="#c0440a" opacity=".92"/>
    <polygon points="275,89 267,99 285,89" fill="#c0440a" opacity=".92"/>
    <circle class="d1" cx="291" cy="71" r="4" fill="#ffcfab"/>
    <circle class="d2" cx="305" cy="71" r="4" fill="#ffcfab"/>
    <circle class="d3" cx="319" cy="71" r="4" fill="#ffcfab"/>
  </g>
  <g class="b2">
    <rect x="330" y="99" width="90" height="34" rx="12" fill="#2e1008" opacity=".95"/>
    <rect x="330" y="99" width="90" height="34" rx="12" fill="none" stroke="#ff865b" stroke-width=".8" opacity=".4"/>
    <polygon points="410,116 421,108 417,127" fill="#2e1008" opacity=".95"/>
    <circle class="d2" cx="355" cy="116" r="3.5" fill="#ff9a44"/>
    <circle class="d3" cx="368" cy="116" r="3.5" fill="#ff9a44"/>
    <circle class="d1" cx="381" cy="116" r="3.5" fill="#ff9a44"/>
  </g>
  <g class="b3">
    <rect x="265" y="136" width="74" height="32" rx="12" fill="#7a3010" opacity=".9"/>
    <polygon points="278,168 270,178 288,168" fill="#7a3010" opacity=".9"/>
    <circle class="d3" cx="287" cy="152" r="3.5" fill="#ffba62"/>
    <circle class="d1" cx="300" cy="152" r="3.5" fill="#ffba62"/>
    <circle class="d2" cx="313" cy="152" r="3.5" fill="#ffba62"/>
  </g>

  <text x="450" y="90" text-anchor="middle" font-family="Georgia,serif" font-size="52" font-weight="700" fill="url(#title)" letter-spacing="-1">Mew-Chat</text>
  <text x="450" y="119" text-anchor="middle" font-family="Georgia,serif" font-size="14" letter-spacing="2" fill="#ffba62" opacity=".8">Real-time Chat App</text>

  <line x1="368" y1="132" x2="532" y2="132" stroke="#ff865b" stroke-width=".7" opacity=".4"/>

  <rect x="368" y="142" width="50" height="18" rx="9" fill="#c0440a" opacity=".3"/>
  <text x="393" y="155" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff9a44">MERN</text>
  <rect x="426" y="142" width="64" height="18" rx="9" fill="#7a3010" opacity=".45"/>
  <text x="458" y="155" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffba62">Socket.IO</text>
  <rect x="498" y="142" width="70" height="18" rx="9" fill="#3d1008" opacity=".6"/>
  <text x="533" y="155" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff865b">Cloudinary</text>

  <rect width="680" height="200" rx="16" fill="none" stroke="#c0440a" stroke-width="1" opacity=".4"/>
</svg>